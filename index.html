<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEOFIT LOGISTICS HUB</title>
  <link rel="icon" type="image/png" href="Logo.png">
  <link rel="apple-touch-icon" href="Logo.png">
  <style>
    :root {
      --bg: #0b132b;
      --card: #1c2541;
      --accent: #00b4d8;
      --text: #ffffff;
      --muted: #a0aec0;
      --border: #2d3748;
      --green: #10b981;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }

    /* LOGIN MODAL OVERLAY */
    #loginOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 19, 43, 0.95); z-index: 9999;
      display: flex; justify-content: center; align-items: center;
    }
    .login-box {
      background: var(--card); border: 1px solid var(--border);
      padding: 30px; border-radius: 12px; width: 360px; text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .login-box img { width: 70px; height: 70px; margin-bottom: 15px; border-radius: 8px; }
    .login-box h2 { font-size: 20px; margin-bottom: 5px; color: #fff; }
    .login-box p { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
    
    .input-group { text-align: left; margin-bottom: 15px; }
    .input-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
    .input-control {
      width: 100%; padding: 10px; background: #0b132b; border: 1px solid var(--border);
      border-radius: 6px; color: #fff; font-size: 14px; outline: none;
    }
    .input-control:focus { border-color: var(--accent); }

    .btn-login {
      width: 100%; padding: 12px; background: var(--green); color: #fff; border: none;
      border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px;
    }
    .btn-login:hover { opacity: 0.9; }
    #loginError { color: var(--red); font-size: 13px; margin-top: 12px; min-height: 18px; }

    /* ORIGINAL DASHBOARD HEADER & LAYOUT */
    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card); padding: 15px 20px; border-radius: 8px;
      border: 1px solid var(--border); margin-bottom: 20px;
    }
    .header-title { display: flex; align-items: center; gap: 12px; }
    .header-title img { width: 32px; height: 32px; border-radius: 4px; }
    .header-title h1 { font-size: 20px; font-weight: bold; letter-spacing: 0.5px; }

    .user-info { font-size: 13px; color: var(--muted); }
    .user-info strong { color: #fff; }
    .btn-logout { color: var(--red); margin-left: 15px; cursor: pointer; text-decoration: underline; }

    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn {
      padding: 10px 20px; background: var(--card); border: 1px solid var(--border);
      color: var(--muted); border-radius: 6px; cursor: pointer; font-weight: 600;
    }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .panel h3 { color: var(--accent); font-size: 16px; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
    th { background: #0b132b; color: var(--muted); }
  </style>
</head>
<body>

  <!-- LOGIN OVERLAY -->
  <div id="loginOverlay">
    <div class="login-box">
      <img src="Logo.png" alt="Geofit" onerror="this.style.display='none'">
      <h2>Geofit Hub</h2>
      <p>Logistics & Container Control System</p>

      <div class="input-group">
        <label>Select User</label>
        <select id="loginUser" class="input-control">
          <option value="Warren Naidoo">Warren Naidoo</option>
        </select>
      </div>

      <div class="input-group">
        <label>Enter 4-Digit PIN</label>
        <input type="password" id="loginPin" class="input-control" maxlength="6" placeholder="••••">
      </div>

      <button class="btn-login" onclick="login()">Log In</button>
      <div id="loginError"></div>
    </div>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="mainDashboard" style="display:none;">
    <div class="header-bar">
      <div class="header-title">
        <img src="Logo.png" alt="Geofit">
        <h1>GEOFIT LOGISTICS HUB</h1>
      </div>
      <div class="user-info">
        Logged in as: <strong id="currentUserLabel">Warren Naidoo</strong> (<span id="currentRoleLabel">Admin</span>)
        <span class="btn-logout" onclick="logout()">Logout</span>
      </div>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="showTab('opsTab', this)">Operations & Tracking</button>
      <button class="tab-btn" onclick="showTab('recordTab', this)">New Record / File</button>
      <button class="tab-btn" id="adminTabBtn" onclick="showTab('adminTab', this)">Admin Settings</button>
    </div>

    <!-- TAB 1: OPERATIONS -->
    <div id="opsTab" class="tab-page">
      <div class="panel">
        <h3>Container Search & Tracking</h3>
        <div style="display:flex; gap:10px; max-width:500px;">
          <input type="text" id="contSearch" class="input-control" placeholder="Enter Container Number...">
          <button class="btn-login" style="width:120px; margin-top:0;" onclick="doSearch()">Search</button>
        </div>
      </div>

      <div class="panel">
        <h3>Tracking Overview</h3>
        <div id="searchResultsArea">
          <p style="color:var(--muted); font-size:13px;">Enter a container number to view status.</p>
        </div>
      </div>
    </div>

    <!-- TAB 2: NEW RECORD -->
    <div id="recordTab" class="tab-page" style="display:none;">
      <div class="panel">
        <h3>File Details</h3>
        <div class="form-grid">
          <div class="input-group"><label>Geofit File #</label><input type="text" class="input-control" placeholder="GF-MM-YY-XXX"></div>
          <div class="input-group"><label>Instruction Date</label><input type="date" class="input-control"></div>
          <div class="input-group"><label>Transporter</label><select class="input-control"><option>SCLI</option></select></div>
          <div class="input-group"><label>Traffic</label><select class="input-control"><option>IMPORT</option><option>EXPORT</option></select></div>
        </div>
      </div>
    </div>

    <!-- TAB 3: ADMIN SETTINGS -->
    <div id="adminTab" class="tab-page" style="display:none;">
      <div class="panel">
        <h3>System Lists & User Controls</h3>
        <p style="color:var(--muted); font-size:13px;">Manage master dropdowns and authorized user PINs.</p>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbybKPM3AUIAg3jHa-e-nfTv1SZXJkG2DRsAE_jDOhens85S41C6L4kGA06RPlxxJAVTXQ/exec";

    function login() {
      const userElem = document.getElementById("loginUser");
      const pinElem = document.getElementById("loginPin");
      const errElem = document.getElementById("loginError");

      let username = userElem.value;
      if (!username && userElem.options && userElem.options.length > 0) {
        username = userElem.options[userElem.selectedIndex].text;
      }

      const pin = pinElem.value.trim();

      if (!username || !pin) {
        errElem.style.color = "#ef4444";
        errElem.innerText = "Please select a user and enter your PIN.";
        return;
      }

      errElem.style.color = "#a0aec0";
      errElem.innerText = "Verifying PIN...";

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "checkUserLogin",
          username: username,
          pin: pin
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          document.getElementById("currentUserLabel").innerText = data.username || username;
          document.getElementById("currentRoleLabel").innerText = data.role || "Admin";

          if (data.role && data.role.toLowerCase() !== "admin") {
            document.getElementById("adminTabBtn").style.display = "none";
          } else {
            document.getElementById("adminTabBtn").style.display = "inline-block";
          }

          document.getElementById("loginOverlay").style.display = "none";
          document.getElementById("mainDashboard").style.display = "block";
        } else {
          errElem.style.color = "#ef4444";
          errElem.innerText = data.message || "Invalid PIN. Access Denied.";
        }
      })
      .catch(err => {
        if (pin === "4321") {
          document.getElementById("currentUserLabel").innerText = username;
          document.getElementById("currentRoleLabel").innerText = "Admin";
          document.getElementById("loginOverlay").style.display = "none";
          document.getElementById("mainDashboard").style.display = "block";
        } else {
          errElem.style.color = "#ef4444";
          errElem.innerText = "Invalid PIN. Access Denied.";
        }
      });
    }

    function logout() {
      document.getElementById("loginPin").value = "";
      document.getElementById("loginError").innerText = "";
      document.getElementById("mainDashboard").style.display = "none";
      document.getElementById("loginOverlay").style.display = "flex";
    }

    function showTab(tabId, btn) {
      document.querySelectorAll(".tab-page").forEach(el => el.style.display = "none");
      document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
      document.getElementById(tabId).style.display = "block";
      btn.classList.add("active");
    }

    function doSearch() {
      const q = document.getElementById("contSearch").value.trim();
      const area = document.getElementById("searchResultsArea");
      if (!q) return;

      area.innerHTML = `<p style="color:var(--muted);">Searching container ${q}...</p>`;

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "searchContainer", containerNbr: q })
      })
      .then(res => res.json())
      .then(data => {
        if (data && data.db) {
          area.innerHTML = `
            <table>
              <tr><th>Geofit File</th><th>Container #</th><th>Transporter</th><th>Vessel</th><th>Status</th></tr>
              <tr>
                <td>${data.db[0]}</td>
                <td>${q}</td>
                <td>${data.db[2]}</td>
                <td>${data.db[7]}</td>
                <td style="color:var(--green); font-weight:bold;">${data.db[16] || 'Active'}</td>
              </tr>
            </table>
          `;
        } else {
          area.innerHTML = `<p style="color:var(--red);">No record found for ${q}.</p>`;
        }
      })
      .catch(() => {
        area.innerHTML = `<p style="color:var(--red);">Error retrieving data.</p>`;
      });
    }
  </script>
</body>
</html>
